# Compose de PRODUCCIÓN: solo Postgres. La app NO corre en Docker en ese servidor — vive en un
# venv con gunicorn bajo systemd (`aluna-kunsama-backend.service`, 127.0.0.1:8004) detrás del
# nginx del host, que además comparte máquina con otros proyectos. Ese montaje es el que está en
# producción hoy y este archivo es exactamente el que ya corre allí: por eso queda como el
# `docker-compose.yml` por defecto, para que un `git pull` en producción nunca cambie su forma de
# desplegar ni un `docker compose up -d` levante servicios que ese servidor no usa.
#
# El stack completo en contenedores (db + app + auto-deploy), que es lo que usan el servidor de
# pruebas y una máquina local, vive en `docker-compose.dev.yaml` y se invoca explícitamente:
#
#     docker compose -f docker-compose.dev.yaml up -d --build
#
# Ver docs/DOCKER.md. Restaurar/respaldar la base (scripts/*_produccion.sh, RUNBOOK de migración)
# sigue funcionando igual con este archivo: solo necesitan el servicio `db`.
services:
  db:
    image: postgres:16
    container_name: aluna_kunsama_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aluna_kunsamu}
      POSTGRES_USER: ${POSTGRES_USER:-aluna_kunsamu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aluna_kunsama_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aluna_kunsamu}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aluna_kunsama_pg_data:
    name: aluna_kunsama_pg_data
